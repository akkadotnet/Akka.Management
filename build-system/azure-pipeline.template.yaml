parameters:
  name: ''
  displayName: ''
  vmImage: ''
  configFileName: '.incrementalist/incrementalist.json'
  timeoutInMinutes: 120
  runAspireTests: false

jobs:
  - job: ${{ parameters.name }}
    displayName: ${{ parameters.displayName }}
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    pool:
      vmImage: ${{ parameters.vmImage }}
    steps:
      - checkout: self  # self represents the repo where the initial Pipelines YAML file was found
        clean: false  # whether to fetch clean each time
        submodules: recursive  # set to 'true' for a single level of submodules or 'recursive' to get submodules of submodules
        persistCredentials: true

      - task: UseDotNet@2
        displayName: 'Use .NET'
        inputs:
          packageType: 'sdk'
          useGlobalJson: true
          
      - script: dotnet tool restore
        displayName: 'Restore dotnet tools'

      - pwsh: |
          .\build.ps1
        displayName: 'Update Release Notes'
        continueOnError: false

      - script: dotnet build -c Release
        displayName: 'dotnet build'
        continueOnError: false

      - script: dotnet incrementalist run --config ${{ parameters.configFileName }} -- test -c Release --no-build --logger:trx --collect:"XPlat Code Coverage" --results-directory TestResults --settings coverlet.runsettings
        displayName: 'Run tests'
        continueOnError: true # Allow continuation even if tests fail

      - ${{ if eq(parameters.runAspireTests, true) }}:
        - script: dotnet test src/aspire/Akka.Aspire.Hosting.Tests/Akka.Aspire.Hosting.Tests.csproj -c Release --no-build --no-restore --logger "trx;LogFileName=aspire.trx" --results-directory "$(Agent.TempDirectory)/aspire-$(System.JobId)"
          displayName: 'Run Aspire hosting tests'
          continueOnError: true
        - pwsh: |
            $ErrorActionPreference = 'Stop'
            [xml]$trx = Get-Content -Raw "$(Agent.TempDirectory)/aspire-$(System.JobId)/aspire.trx"
            $results = @($trx.SelectNodes("/*[local-name()='TestRun']/*[local-name()='Results']/*[local-name()='UnitTestResult']"))
            if ($results.Count -eq 0) { throw 'No Aspire test results found' }
            foreach ($result in $results) {
              if ($result.GetAttribute('outcome') -cne 'Passed') {
                throw "Test did not pass: $($result.GetAttribute('testName')) ($($result.GetAttribute('outcome')))"
              }
            }
            $required = @(
              'Akka.Aspire.Hosting.Tests.AspireClusterFormationSpecs.Service_should_form_a_three_node_cluster_and_report_healthy'
              'Akka.Aspire.Hosting.Tests.AspireClusterFormationSpecs.Service_should_respond_to_root_endpoint'
            )
            foreach ($name in $required) {
              $matches = @($results | Where-Object { $_.GetAttribute('testName') -ceq $name })
              if ($matches.Count -ne 1) { throw "Expected exactly one result for $name; found $($matches.Count)" }
            }
            Write-Host 'Aspire integration tests both passed'
          displayName: 'Verify Aspire integration results'
          continueOnError: true
        - task: PublishTestResults@2
          inputs:
            testResultsFormat: VSTest
            testResultsFiles: '$(Agent.TempDirectory)/aspire-$(System.JobId)/aspire.trx'
            testRunTitle: 'Aspire hosting tests'
            failTaskOnFailedTests: false
            publishRunAttachments: true

      - task: PublishTestResults@2
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: '**/*.trx' #TestResults folder usually
          testRunTitle: ${{ parameters.name }}
          mergeTestResults: true
          failTaskOnFailedTests: false
          publishRunAttachments: true

      - pwsh: |
          $coverageFiles = Get-ChildItem -Path "$(Build.SourcesDirectory)/TestResults" -Filter "*.cobertura.xml" -Recurse
          $hasCoverageFiles = $coverageFiles.Count -gt 0
          Write-Host "##vso[task.setvariable variable=HasCoverageFiles]$hasCoverageFiles"
        displayName: 'Check for Coverage Files'
        condition: always()
        continueOnError: true

      - task: reportgenerator@5
        displayName: ReportGenerator
        # Only run if coverage files exist
        condition: and(always(), eq(variables['HasCoverageFiles'], 'True'))
        continueOnError: true
        inputs:
          reports: '$(Build.SourcesDirectory)/TestResults/**/*.cobertura.xml'
          targetdir: '$(Build.SourcesDirectory)/coveragereport'
          reporttypes: 'HtmlInline_AzurePipelines;Cobertura;Badges'
          assemblyfilters: '-xunit*'
          publishCodeCoverageResults: true

      - publish: $(Build.SourcesDirectory)/coveragereport
        displayName: 'Publish Coverage Report'
        # Only run if coverage files exist
        condition: and(always(), eq(variables['HasCoverageFiles'], 'True'))
        continueOnError: true
        artifact: 'CoverageReports-$(Agent.OS)-$(Build.BuildId)'
          
      - script: dotnet pack -c Release --no-build -o $(Build.ArtifactStagingDirectory)/nuget
        displayName: 'Create packages'
          
      - task: PublishBuildArtifacts@1
        displayName: 'Publish artifacts'
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)/nuget'
          ArtifactName: 'nuget'
          publishLocation: 'Container'

      - script: 'echo 1>&2'
        failOnStderr: true
        displayName: 'If above is partially succeeded, then fail'
        condition: eq(variables['Agent.JobStatus'], 'SucceededWithIssues')
