######################################################
# Akka Service Discovery Redis Config                #
######################################################

akka.discovery {
  # Set the following in your application.conf if you want to use this discovery mechanism:
  # method = redis
  redis {
    class = "Akka.Discovery.Redis.RedisServiceDiscovery, Akka.Discovery.Redis"

    # If set to true, the extension will not register or refresh its own entry in Redis.
    # Only needs to be set to true if the extension is being used by a read-only consumer
    # such as ClusterClient contact discovery.
    read-only = false

    # The public facing IP/host of this node.
    # akka.remote.dot-netty.tcp.public-hostname is used if not overridden or empty.
    # if akka.remote.dot-netty.tcp.public-hostname is empty, Dns.GetHostName is used.
    public-hostname = ""

    # The public open akka management port of this node.
    # The value will need to be from 1 to 65535, auto-assign port (0) is not supported.
    public-port = 8558

    # The service name assigned to the cluster.
    service-name = "default"

    # The connection string used to connect to Redis.
    # MANDATORY FIELD: MUST be provided, else the discovery plugin WILL throw an exception.
    connection-string = "<connection-string>"

    # The time-to-live for Redis keys, defaults to 2 minutes.
    # Keys that are not refreshed within this period will auto-expire (Redis handles physical removal
    # of dead nodes natively via key TTL, so no explicit pruning is required).
    ttl = 2m

    # The time-to-live heartbeat update interval, defaults to 30 seconds.
    # MUST be less than ttl.
    ttl-heartbeat-interval = 30s

    # The threshold for a cluster member entry to be considered stale and excluded from lookups.
    # This lets dead nodes drop out of discovery results faster than the physical key TTL expiry.
    # Override this value by providing a value greater than ttl-heartbeat-interval.
    #   * If set to 0, this uses min(ttl-heartbeat-interval * 3, ttl).
    #   * If set to a value less than or equal to ttl-heartbeat-interval, discovery WILL throw an exception.
    stale-ttl-threshold = 0

    # The key prefix used for all Redis keys.
    key-prefix = "akka:discovery"

    # The timeout period for all Redis operations, must be greater than zero, defaults to 10 seconds.
    operation-timeout = 10s

    # The retry backoff for all Redis operations, must be greater than zero, defaults to 500 milliseconds.
    retry-backoff = 500ms

    # The maximum retry backoff for all Redis operations, must be greater than retry-backoff, defaults to 5 seconds.
    max-retry-backoff = 5s
  }
}
